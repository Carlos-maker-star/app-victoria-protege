spring.application.name=protege
spring.profiles.default=local

spring.datasource.url=jdbc:postgresql://localhost:5433/victoria_protege

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# JWT: obligatorio, minimo 32 caracteres. En local va en application-local.properties; en otro entorno,
# en la variable de entorno JWT_SECRET. No hay valor por defecto a proposito (el repositorio es publico).
app.jwt.secret=${JWT_SECRET}
app.jwt.expiracion-horas=12

# Origenes permitidos (Angular en local)
app.cors.origenes=http://localhost:4200

# Usuarios de prueba (solo perfil local): la clave comun app.seed.password se define en
# application-local.properties (ver el .example), no aqui.

# Documentacion de la API (OpenAPI / Swagger UI). En produccion: APP_DOCS=false
springdoc.api-docs.enabled=${APP_DOCS:true}
springdoc.swagger-ui.enabled=${APP_DOCS:true}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.doc-expansion=none

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Evidencias (fotos, videos y notas). Los archivos se guardan en disco, fuera de la base.
app.evidencias.directorio=${EVIDENCIAS_DIR:./evidencias-data}
app.evidencias.max-foto-mb=8
app.evidencias.max-video-mb=40
app.evidencias.max-por-alerta=10
spring.servlet.multipart.max-file-size=41MB
spring.servlet.multipart.max-request-size=42MB

# Freno al login: intentos fallidos seguidos de un usuario antes de bloquearlo, y minutos de bloqueo
app.seguridad.login-max-intentos=5
app.seguridad.login-bloqueo-minutos=15
